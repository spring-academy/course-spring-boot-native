apiVersion: training.educates.dev/v1beta1
kind: TrainingPortal
metadata:
  name: spring-boot-native
spec:
  portal:
    registration:
      type: anonymous
    updates:
      workshop: true
    sessions:
      maximum: 15
    theme:
      frame:
        ancestors:
        - https://spring.academy
        - https://*.spring.academy
        - https://*.vmware.com
        - https://*.broadcom.com
        - https://spring-staging.academy
        - https://spring-academy.broadcom.com
        - https://spring-academy-verify.broadcom.com
        - https://spring-academy-qa.broadcom.net
        - https://spring-academy-dev.broadcom.net
        - http://localhost:8080
    workshop:
      defaults:
        expires: 60m
        orphaned: 5m
        reserved: ${TRAINING_PORTAL_RESERVED}
  analytics:
    google:
      trackingId: "${ANALYTICS_GOOGLE_ID}"
    clarity:
      trackingId: "${ANALYTICS_CLARITY_ID}"
  workshops:
    # The following are the items that should be added to the trainingportal in the deployment environment.
    - name: spr-boot-native-first-lab
    - name: spr-boot-native-migrating-existing-app

